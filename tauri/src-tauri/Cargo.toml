[package]
name = "hanoi-tauri"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Towers of Hanoi: Tauri desktop front-end (Rust backend reusing the hanoigame crate, static web UI). Kept in sync with the other front-ends."

[[bin]]
name = "hanoi-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hanoigame = { path = "../../rust/hanoigame" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
