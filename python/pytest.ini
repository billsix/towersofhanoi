[pytest]
pythonpath = src
# Doctests in the library are part of the suite (collected by --doctest-modules).
# Every src module imports cleanly headless -- the front-ends guard their executable
# entry code behind `if __name__ == "__main__":` -- so the whole package is collected
# with no allowlist; if a future module runs code at import, guard it the same way
# rather than excluding it here.
# --import-mode=importlib so --doctest-modules imports each src file as
# `hanoigame.<mod>` (respecting the package), or the modules' relative imports
# (`from .hanoimodel import ...`) fail with "no known parent package".
addopts = --doctest-modules --import-mode=importlib
testpaths =
    tests
    src
