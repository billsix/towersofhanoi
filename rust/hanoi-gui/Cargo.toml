[package]
name = "hanoi-gui"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Towers of Hanoi: wxDragon GUI front-end (Rust port of the wxPython hanoi-gui, kept in sync)."

[[bin]]
name = "hanoi-gui"
path = "src/main.rs"

[dependencies]
hanoigame = { path = "../hanoigame" }
# The "xrc" feature (not on by default) enables loading the UI from the shared
# ui/hanoi.xrc (XmlResource + find_child_by_xrc_name + MenuBar::from_xrc_name).
wxdragon = { version = "0.9.23", features = ["xrc"] }
