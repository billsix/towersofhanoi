# Empty [workspace] table: the Tauri crate lives UNDER rust/ now (as another UI, like
# hanoi-gui) but is deliberately NOT a member of the rust/ Cargo workspace -- Tauri needs
# its own build. This makes it its own workspace root so cargo doesn't fold it into the
# parent workspace at rust/Cargo.toml. It reuses the hanoigame crate by path below.
[workspace]

[package]
name = "hanoi-tauri"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Towers of Hanoi: Tauri desktop front-end (Rust backend reusing the hanoigame crate, static web UI). Kept in sync with the other front-ends."

[[bin]]
name = "hanoi-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hanoigame = { path = "../../hanoigame" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
