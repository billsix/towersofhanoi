# trunk config for the egui web build (make egui-web / make egui-serve). The build output
# goes to dist/ (gitignored); serve binds 0.0.0.0:8080 so it is reachable from the host
# when run in the container (the Makefile also passes --address 0.0.0.0).
[build]
dist = "dist"

[serve]
address = "0.0.0.0"
port = 8080
