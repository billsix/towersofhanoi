# Towers of Hanoi: egui/eframe front-end (native + web/WebAssembly) over the shared
# hanoigame engine. Its OWN workspace (not a member of ../Cargo.toml) -- like the Tauri
# crate -- so `make check` isn't slowed by the egui ecosystem and the web build can keep
# its own profile. See ../../tasks/rust-egui-native-and-web.md.
[workspace]

[package]
name = "hanoi-egui"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Towers of Hanoi: egui/eframe GUI (native + web), over the shared hanoigame engine."

[[bin]]
name = "hanoi-egui"
path = "src/main.rs"

[dependencies]
hanoigame = { path = "../hanoigame" }
# egui / eframe move fast and break between releases, so pin exactly. glow (OpenGL) is the
# lighter renderer and gives WebGL on the web target -- enough for this 2D board. Bump with
# a changelog read (see the task). 0.29 is the pinned baseline.
egui = "=0.29.1"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }

# Web-only: start eframe's WebRunner on a <canvas>. Native builds ignore these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
