<!DOCTYPE html>
<!-- trunk entry page for the egui web build. `trunk build`/`trunk serve` compiles this
     crate to wasm (the `data-trunk rel="rust"` link) and loads it; the wasm main
     (src/main.rs, cfg(wasm32)) starts eframe's WebRunner on #hanoi_canvas. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Towers of Hanoi (egui)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e2432;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="2" />
  </head>
  <body>
    <canvas id="hanoi_canvas"></canvas>
  </body>
</html>
